# AI Worker Activity Monitoring Configuration
camera:
  fps: 30
  resolution: [1920, 1080]
  stream_url: "0"

models:
  detection: "yolov8n.pt"
  pose: "yolov8n-pose.pt"
  conf_threshold: 0.25
  nms_threshold: 0.45
  device: "" # Leave empty to auto-detect (CUDA/CPU)

tracking:
  tracker_type: "bytetrack.yaml" # or "botsort.yaml"
  persist: true

activity:
  grace_period_seconds: 8.0
  working_confirmation_seconds: 2.0
  not_working_confirmation_seconds: 1.0
  uncertain_timeout_seconds: 5.0
  score_thresholds:
    working: 70
    uncertain: 40

# Initial default workstation zone (can be dynamically updated)
workstations:
  - id: "WS-01"
    zone: [100, 100, 800, 800] # [x1, y1, x2, y2] default bounding box
